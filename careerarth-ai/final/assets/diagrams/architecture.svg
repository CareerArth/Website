<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" font-family="'Work Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3A35"/>
    </marker>
  </defs>
  <rect width="1240" height="560" fill="#F7F3E8"/>
  <text x="620" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#1E3329" font-weight="bold">CareerArth AI — System Architecture (Five Layers)</text>

  <!-- Browser column -->
  <rect x="30" y="80" width="220" height="440" rx="12" fill="#FFFFFF" stroke="#E6E1D6" stroke-width="2"/>
  <text x="140" y="108" text-anchor="middle" font-size="13" fill="#B59654" font-weight="600" letter-spacing="2">BROWSER</text>
  <g font-size="13" fill="#1A1C1B">
    <rect x="50" y="125" width="180" height="52" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="140" y="147" text-anchor="middle" font-weight="600">Intake wizard</text>
    <text x="140" y="164" text-anchor="middle" font-size="11" fill="#2C3A35">profile + questionnaire</text>
    <rect x="50" y="255" width="180" height="52" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="140" y="277" text-anchor="middle" font-weight="600">Customer report</text>
    <text x="140" y="294" text-anchor="middle" font-size="11" fill="#2C3A35">scorecard · paths · plan</text>
    <rect x="50" y="330" width="180" height="52" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="140" y="352" text-anchor="middle" font-weight="600">Consultant review</text>
    <text x="140" y="369" text-anchor="middle" font-size="11" fill="#2C3A35">approve / flag / edit</text>
    <rect x="50" y="405" width="180" height="44" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="140" y="432" text-anchor="middle" font-weight="600">Runs &amp; metrics</text>
  </g>

  <!-- Server pipeline -->
  <rect x="300" y="80" width="620" height="300" rx="12" fill="#1E3329"/>
  <text x="320" y="108" font-size="13" fill="#B59654" font-weight="600" letter-spacing="2">NODE SERVER — DIAGNOSTIC PIPELINE</text>
  <g font-size="13.5" fill="#F7F3E8">
    <rect x="320" y="128" width="130" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="385" y="152" text-anchor="middle" font-weight="600">1 · Validate</text>
    <text x="385" y="169" text-anchor="middle" font-size="11" fill="#E6E1D6">schema + consent</text>
    <rect x="475" y="128" width="130" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="540" y="152" text-anchor="middle" font-weight="600">2 · Score</text>
    <text x="540" y="169" text-anchor="middle" font-size="11" fill="#E6E1D6">deterministic ARTH</text>
    <rect x="630" y="128" width="130" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="695" y="152" text-anchor="middle" font-weight="600">3 · Retrieve</text>
    <text x="695" y="169" text-anchor="middle" font-size="11" fill="#E6E1D6">top-5 KB roles</text>
    <rect x="785" y="128" width="115" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="842" y="152" text-anchor="middle" font-weight="600">4 · Generate</text>
    <text x="842" y="169" text-anchor="middle" font-size="11" fill="#E6E1D6">AI analysis</text>
    <rect x="475" y="230" width="130" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="540" y="254" text-anchor="middle" font-weight="600">5 · Lint</text>
    <text x="540" y="271" text-anchor="middle" font-size="11" fill="#E6E1D6">every claim cited</text>
    <rect x="630" y="230" width="130" height="56" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="695" y="254" text-anchor="middle" font-weight="600">Persist + log</text>
    <text x="695" y="271" text-anchor="middle" font-size="11" fill="#E6E1D6">runs · events</text>
  </g>
  <g stroke="#B59654" stroke-width="2" fill="none" marker-end="url(#arr2)">
    <line x1="450" y1="156" x2="473" y2="156"/>
    <line x1="605" y1="156" x2="628" y2="156"/>
    <line x1="760" y1="156" x2="783" y2="156"/>
    <path d="M 842 184 L 842 258 L 762 258"/>
    <line x1="605" y1="258" x2="628" y2="258" transform="translate(1233,0) scale(-1,1)"/>
  </g>

  <!-- data stores -->
  <g font-size="12.5" fill="#1A1C1B">
    <rect x="300" y="410" width="185" height="70" rx="8" fill="#FFFFFF" stroke="#B59654"/>
    <text x="392" y="435" text-anchor="middle" font-weight="600">scoring-config.json</text>
    <text x="392" y="452" text-anchor="middle" font-size="11" fill="#2C3A35">weights · modifiers · bands</text>
    <text x="392" y="467" text-anchor="middle" font-size="11" fill="#2C3A35">(single source of truth)</text>
    <rect x="505" y="410" width="185" height="70" rx="8" fill="#FFFFFF" stroke="#B59654"/>
    <text x="597" y="435" text-anchor="middle" font-weight="600">Knowledge base</text>
    <text x="597" y="452" text-anchor="middle" font-size="11" fill="#2C3A35">18 roles · 3 industries</text>
    <text x="597" y="467" text-anchor="middle" font-size="11" fill="#2C3A35">O*NET-sourced, curated</text>
    <rect x="710" y="410" width="185" height="70" rx="8" fill="#FFFFFF" stroke="#B59654"/>
    <text x="802" y="435" text-anchor="middle" font-weight="600">data/ (local files)</text>
    <text x="802" y="452" text-anchor="middle" font-size="11" fill="#2C3A35">runs · events.jsonl</text>
    <text x="802" y="467" text-anchor="middle" font-size="11" fill="#2C3A35">funnel instrumentation</text>
  </g>
  <g stroke="#2C3A35" stroke-width="1.6" stroke-dasharray="none" fill="none" marker-end="url(#arr2)">
    <line x1="392" y1="408" x2="530" y2="188"/>
    <line x1="597" y1="408" x2="688" y2="188"/>
    <line x1="760" y1="286" x2="795" y2="408"/>
  </g>

  <!-- Claude API -->
  <rect x="960" y="110" width="250" height="120" rx="12" fill="#FFFFFF" stroke="#B59654" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1085" y="140" text-anchor="middle" font-size="14" fill="#1E3329" font-weight="600">Claude API (Opus)</text>
  <text x="1085" y="160" text-anchor="middle" font-size="11.5" fill="#2C3A35">structured JSON output ·</text>
  <text x="1085" y="176" text-anchor="middle" font-size="11.5" fill="#2C3A35">grounding rules in prompt</text>
  <text x="1085" y="200" text-anchor="middle" font-size="11" fill="#9c3d2e" font-weight="600">implemented, not yet</text>
  <text x="1085" y="215" text-anchor="middle" font-size="11" fill="#9c3d2e" font-weight="600">exercised live (no API key)</text>

  <rect x="960" y="255" width="250" height="95" rx="12" fill="#FFFFFF" stroke="#E6E1D6" stroke-width="2"/>
  <text x="1085" y="285" text-anchor="middle" font-size="14" fill="#1E3329" font-weight="600">Mock generator</text>
  <text x="1085" y="305" text-anchor="middle" font-size="11.5" fill="#2C3A35">deterministic template —</text>
  <text x="1085" y="321" text-anchor="middle" font-size="11.5" fill="#2C3A35">all reports to date use this</text>
  <text x="1085" y="337" text-anchor="middle" font-size="11.5" fill="#2C3A35">(zero cost, reproducible)</text>

  <g stroke="#2C3A35" stroke-width="2" fill="none" marker-end="url(#arr2)">
    <line x1="902" y1="156" x2="958" y2="163" stroke-dasharray="7 5"/>
    <line x1="902" y1="170" x2="958" y2="290"/>
    <line x1="252" y1="151" x2="298" y2="151"/>
    <path d="M 300 258 L 232 281" />
  </g>
</svg>
