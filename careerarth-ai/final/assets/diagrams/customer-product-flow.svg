<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" font-family="'Work Sans','Segoe UI',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3A35"/>
    </marker>
  </defs>
  <rect width="1240" height="360" fill="#F7F3E8"/>
  <text x="620" y="40" text-anchor="middle" font-family="Georgia,serif" font-size="22" fill="#1E3329" font-weight="bold">CareerArth AI — Customer &amp; Product Flow</text>

  <!-- free band -->
  <rect x="30" y="70" width="770" height="180" rx="12" fill="#FFFFFF" stroke="#E6E1D6" stroke-width="2"/>
  <text x="46" y="96" font-size="13" fill="#B59654" font-weight="600" letter-spacing="2">FREE DIAGNOSTIC (TOP OF FUNNEL)</text>
  <!-- paid band -->
  <rect x="830" y="70" width="380" height="180" rx="12" fill="#1E3329"/>
  <text x="846" y="96" font-size="13" fill="#B59654" font-weight="600" letter-spacing="2">PAID (REVENUE EVENT)</text>

  <!-- free steps -->
  <g font-size="14" fill="#1A1C1B">
    <rect x="50" y="115" width="120" height="70" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="110" y="145" text-anchor="middle" font-weight="600">Discovery</text>
    <text x="110" y="163" text-anchor="middle" font-size="11" fill="#2C3A35">site / outreach</text>

    <rect x="205" y="115" width="130" height="70" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="270" y="140" text-anchor="middle" font-weight="600">Structured intake</text>
    <text x="270" y="158" text-anchor="middle" font-size="11" fill="#2C3A35">profile + 20-item</text>
    <text x="270" y="172" text-anchor="middle" font-size="11" fill="#2C3A35">ARTH questionnaire</text>

    <rect x="370" y="115" width="130" height="70" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="435" y="140" text-anchor="middle" font-weight="600">ARTH scorecard</text>
    <text x="435" y="158" text-anchor="middle" font-size="11" fill="#2C3A35">deterministic rubric,</text>
    <text x="435" y="172" text-anchor="middle" font-size="11" fill="#2C3A35">no AI in the numbers</text>

    <rect x="535" y="115" width="130" height="70" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="600" y="140" text-anchor="middle" font-weight="600">AI analysis</text>
    <text x="600" y="158" text-anchor="middle" font-size="11" fill="#2C3A35">grounded in curated</text>
    <text x="600" y="172" text-anchor="middle" font-size="11" fill="#2C3A35">career knowledge base</text>

    <rect x="700" y="115" width="80" height="70" rx="8" fill="#F0ECE1" stroke="#B59654"/>
    <text x="740" y="145" text-anchor="middle" font-weight="600">Report</text>
    <text x="740" y="163" text-anchor="middle" font-size="11" fill="#2C3A35">+ CTA</text>
  </g>

  <!-- paid steps -->
  <g font-size="14" fill="#F7F3E8">
    <rect x="850" y="115" width="150" height="70" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="925" y="140" text-anchor="middle" font-weight="600">Consultant review</text>
    <text x="925" y="158" text-anchor="middle" font-size="11" fill="#E6E1D6">human approves / edits</text>
    <text x="925" y="172" text-anchor="middle" font-size="11" fill="#E6E1D6">every analysis</text>

    <rect x="1035" y="115" width="150" height="70" rx="8" fill="#2C3A35" stroke="#B59654"/>
    <text x="1110" y="140" text-anchor="middle" font-weight="600">Paid consultation</text>
    <text x="1110" y="158" text-anchor="middle" font-size="11" fill="#E6E1D6">strategy session ·</text>
    <text x="1110" y="172" text-anchor="middle" font-size="11" fill="#E6E1D6">follow-up &amp; referral</text>
  </g>

  <!-- arrows -->
  <g stroke="#2C3A35" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="170" y1="150" x2="203" y2="150"/>
    <line x1="335" y1="150" x2="368" y2="150"/>
    <line x1="500" y1="150" x2="533" y2="150"/>
    <line x1="665" y1="150" x2="698" y2="150"/>
    <line x1="780" y1="150" x2="848" y2="150"/>
    <line x1="1000" y1="150" x2="1033" y2="150"/>
  </g>

  <!-- instrumentation strip -->
  <rect x="30" y="275" width="1180" height="60" rx="10" fill="#F0ECE1" stroke="#E6E1D6"/>
  <text x="46" y="299" font-size="12" fill="#B59654" font-weight="600" letter-spacing="2">INSTRUMENTED EVENTS (BUILT INTO THE MVP)</text>
  <text x="46" y="321" font-size="12.5" fill="#2C3A35">intake_started · intake_step_completed · intake_completed · report_generated · report_viewed · usefulness_rating · consultation_interest · review_submitted</text>
</svg>
